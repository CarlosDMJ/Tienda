    let currentSlide = 0;
    let showNotes = true;

    function renderSlide() {
      const slide = slides[currentSlide];
      const container = document.getElementById("slide-content");
      document.getElementById("slide-indicator").innerText = `${currentSlide + 1} / ${slides.length}`;
      document.getElementById("btn-prev").disabled = (currentSlide === 0);
      document.getElementById("btn-next").disabled = (currentSlide === slides.length - 1);

      container.innerHTML = `
        <div class="slide-header">
          <div>
            <div class="slide-number">${slide.number}</div>
            <h2 class="slide-title">${slide.title}</h2>
          </div>
        </div>
        <div class="slide-body">
          ${slide.body}
        </div>
        <div class="speaker-notes-box" id="speaker-box" style="display: ${showNotes ? 'block' : 'none'};">
          <div class="speaker-notes-title">🎙️ Speech del Expositor (Guión para el tribunal):</div>
          <p style="font-style: italic;">"${slide.speech}"</p>
        </div>
      `;
    }

    function nextSlide() {
      if (currentSlide < slides.length - 1) {
        currentSlide++;
        renderSlide();
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        renderSlide();
      }
    }

    function toggleNotes() {
      showNotes = !showNotes;
      const box = document.getElementById("speaker-box");
      if (box) box.style.display = showNotes ? 'block' : 'none';
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") nextSlide();
      if (e.key === "ArrowLeft" || e.key === "PageUp") prevSlide();
    });

    renderSlide();
  </script>
